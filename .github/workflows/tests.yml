name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          # Git for Windows rewrites line endings on checkout, and the tests
          # compare file hashes with the ones recorded in results/.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (standard library only)
        run: python -m unittest discover -s tests -v
